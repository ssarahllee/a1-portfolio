<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-label="The model routes each question; deterministic code builds the answer" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <style>
    .ink { fill: #1f1f1d; }
    .quiet { fill: #5f5e5a; }
    .edge { stroke: #8f8e86; }
    .box { fill: none; stroke: #8f8e86; stroke-width: 1.25; }
    .accent { fill: #2f6fdb; fill-opacity: 0.12; stroke: #2f6fdb; stroke-width: 2; }
    .line { fill: none; stroke: #8f8e86; stroke-width: 1.25; }
    .arrow { fill: #8f8e86; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrow"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="15" font-weight="600" class="ink">The model routes each question; deterministic code builds the answer</text>
  <text x="24" y="62" font-size="11.5" class="quiet">Every month, automatically (GitHub Actions)</text>

  <g class="line">
    <path d="M214 98H272V158H330" marker-end="url(#arch-arrow)"/>
    <path d="M214 158H330" marker-end="url(#arch-arrow)"/>
    <path d="M214 218H272V158" marker-end="url(#arch-arrow)"/>
  </g>

  <rect x="24" y="76" width="190" height="44" rx="8" class="box"/>
  <text x="119" y="95" text-anchor="middle" font-weight="600" class="ink">CMS NPPES</text>
  <text x="119" y="111" text-anchor="middle" font-size="11.5" class="quiet">provider registry</text>

  <rect x="24" y="136" width="190" height="44" rx="8" class="box"/>
  <text x="119" y="155" text-anchor="middle" font-weight="600" class="ink">NUCC taxonomy</text>
  <text x="119" y="171" text-anchor="middle" font-size="11.5" class="quiet">specialty names</text>

  <rect x="24" y="196" width="190" height="44" rx="8" class="box"/>
  <text x="119" y="215" text-anchor="middle" font-weight="600" class="ink">HUD and FIPS</text>
  <text x="119" y="231" text-anchor="middle" font-size="11.5" class="quiet">ZIP to county</text>

  <rect x="330" y="136" width="240" height="44" rx="8" class="box"/>
  <text x="450" y="155" text-anchor="middle" font-weight="600" class="ink">One DuckDB file</text>
  <text x="450" y="171" text-anchor="middle" font-size="11.5" class="quiet">about 362 MB, pre-joined</text>

  <path d="M526 180V284" class="line" marker-end="url(#arch-arrow)"/>
  <text x="538" y="236" font-size="11.5" class="quiet">queried at run time</text>
  <text x="24" y="268" font-size="11.5" class="quiet">Every question</text>

  <g class="line">
    <path d="M152 310H170" marker-end="url(#arch-arrow)"/>
    <path d="M298 310H316" marker-end="url(#arch-arrow)"/>
    <path d="M444 310H462" marker-end="url(#arch-arrow)"/>
    <path d="M590 310H608" marker-end="url(#arch-arrow)"/>
  </g>

  <rect x="24" y="284" width="128" height="52" rx="8" class="box"/>
  <text x="88" y="304" text-anchor="middle" font-weight="600" class="ink">Ask</text>
  <text x="88" y="322" text-anchor="middle" font-size="11.5" class="quiet">in plain English</text>

  <rect x="170" y="284" width="128" height="52" rx="8" class="box"/>
  <text x="234" y="304" text-anchor="middle" font-weight="600" class="ink">Agent routes</text>
  <text x="234" y="322" text-anchor="middle" font-size="11.5" class="quiet">to a search tool</text>

  <rect x="316" y="284" width="128" height="52" rx="8" class="accent"/>
  <text x="380" y="304" text-anchor="middle" font-weight="600" class="ink">Code cleans</text>
  <text x="380" y="322" text-anchor="middle" font-size="11.5" class="quiet">and validates</text>

  <rect x="462" y="284" width="128" height="52" rx="8" class="box"/>
  <text x="526" y="304" text-anchor="middle" font-weight="600" class="ink">SQL runs on</text>
  <text x="526" y="322" text-anchor="middle" font-size="11.5" class="quiet">DuckDB</text>

  <rect x="608" y="284" width="128" height="52" rx="8" class="box"/>
  <text x="672" y="304" text-anchor="middle" font-weight="600" class="ink">Two panes</text>
  <text x="672" y="322" text-anchor="middle" font-size="11.5" class="quiet">summary + rows</text>

  <path d="M170 348H298" class="line"/>
  <text x="234" y="368" text-anchor="middle" font-size="11.5" class="quiet">Language model</text>
  <path d="M316 348H736" class="line"/>
  <text x="526" y="368" text-anchor="middle" font-size="11.5" class="quiet">Deterministic code</text>
</svg>
