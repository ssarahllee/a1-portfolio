    </header>

    <!--contact section-->
    <main class="container section">
      <h1 class="cs-title">Contact</h1>
      <h2 class="cs-summary">Send me a message!</h2>
      <form class="contact-form">
        <div class="mb-4">
          <label for="contactName" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="contactName"
            name="name"
            placeholder="Your Name"
            required
          />
        </div>
        <div class="mb-4">
          <label for="contactEmail" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="contactEmail"
            name="email"
            placeholder="name@example.com"
            required
          />
        </div>
        <div class="mb-4">
          <label for="contactSubject" class="form-label">Subject</label>
          <input
            type="text"
            class="form-control"
            id="contactSubject"
            name="subject"
            placeholder="What is this about?"
          />
        </div>
        <div class="mb-4">
          <label for="contactMessage" class="form-label">Message</label>
          <textarea
            type="text"
            class="form-control"
            id="contactMessage"
            name="message"
            rows="5"
            placeholder="Write your message here."
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-dark rounded-pill footer-btn">
          Send Message
        </button>
      </form>
    </main>
    <!-- footer -->
    <footer id="contact" class="footer">
